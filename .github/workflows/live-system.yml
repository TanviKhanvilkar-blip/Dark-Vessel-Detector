# The live system in the cloud: record AIS, process new satellite passes, publish the website.
# Each run is one shift of up to 5 h 45 min (GitHub's limit is 6 h), and each shift starts the next one when it ends, so the
# system keeps itself going. GitHub's schedules are best-effort (the first one simply did not fire), so the cron entry is only
# a backstop that restarts the chain if a shift fails. Pushing a change to this file also starts a shift.
name: Live system

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/live-system.yml"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes this shift should run"
        default: "345"

concurrency:
  group: live-system
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - name: Install
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cloud.txt
      - name: Run shift
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/cloud_shift.sh "${{ inputs.minutes || '345' }}"
      # runs only if the shift succeeded, so a broken shift can't restart itself in a loop; the cron backstop retries instead
      - name: Start next shift
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-system.yml --ref main
